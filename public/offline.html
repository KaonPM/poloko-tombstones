<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14110D" />
    <title>Poloko Tombstones - Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #f4efe6; color: #14110d; font-family: Georgia, "Times New Roman", serif; text-align: center; }
      main { max-width: 520px; padding: 40px; border: 1px solid #c8a96a; background: #fff9ef; }
      img { width: 150px; height: 150px; object-fit: contain; }
      h1 { margin: 18px 0 10px; font-size: 34px; }
      p { color: #6c5a45; line-height: 1.7; }
      button { margin-top: 12px; border: 0; padding: 13px 20px; background: #14110d; color: #c8a96a; font: 700 14px Georgia, serif; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/poloko-tombstones-logo.png" alt="Poloko Tombstones" />
      <h1>You are offline</h1>
      <p>Your connection is unavailable. Previously visited pages may still be accessible, or reconnect and try again.</p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
